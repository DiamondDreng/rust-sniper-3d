[package]
name = "RustShooter"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.18.1", features = ["serialize"] }
# Networking: versions chosen from the official compatibility tables for Bevy 0.18.
bevy_replicon = "0.40"
bevy_replicon_renet = "0.16"
serde = { version = "1", features = ["derive"] }

# Faster iteration: light optimization for our code, full optimization for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
